[package]
name = "amadeus_desktop"
version = "0.0.0"
description = "Amadeus desktop shell"
authors = ["Amadeus contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "amadeus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
